services:
  mongodb:
    image: mongo:7.0
    container_name: numberplate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: numberplate_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - numberplate-network

volumes:
  mongodb_data:
    driver: local

networks:
  numberplate-network:
    driver: bridge